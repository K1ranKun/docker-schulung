services:
  appy-web:
    image: appy:1.0h
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WAR_FILE: appy-h.war
    container_name: appy-web
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://appy-db:5432/testdb
      DB_USERNAME: testuser
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - source: db_password
        target: DB_PASSWORD
    depends_on:
      appy-db:
        condition: service_healthy
    networks:
      - appy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /usr/local/tomcat/temp
      - /usr/local/tomcat/work
      - /usr/local/tomcat/logs
      - /usr/local/tomcat/conf/Catalina/localhost
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 300
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
 
  appy-db:
    image: postgres:17-alpine
    container_name: appy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: testdb
    secrets:
      - db_password
    volumes:
      - appy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - appy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 300
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
 
  nginx-proxy:
    image: nginx:1.29-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../03.Network-Compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network
      - appy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 200
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
 
networks:
  proxy-network:
    driver: bridge
  appy-network:
    driver: bridge
    internal: true
 
volumes:
  appy-db-data:
 
secrets:
  db_password:
    file: .secrets.txt