services:
  appy-web:
    image: appy:1.0
    build:
      context: ../02.Build-Compose
      dockerfile: Dockerfile
      args:
        WAR_FILE: appy.war
    container_name: appy-web
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://appy-db:5432/testdb
      DB_USERNAME: testuser
      DB_PASSWORD: test123
    depends_on:
      appy-db:
        condition: service_healthy
    networks:
      - appy-network

  appy-db:
    image: postgres
    container_name: appy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-testuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test123}
      POSTGRES_DB: ${DB_NAME:-testdb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - appy-network

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../03.Network-Compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network
      - appy-network

networks:
  proxy-network:
    driver: bridge
  appy-network:
    driver: bridge
    internal: true