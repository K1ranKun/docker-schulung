services:
  appy-web:
    image: appy:1.0
    build:
      context: ../02.Build-Compose
      dockerfile: Dockerfile
      args:
        WAR_FILE: appy.war
    container_name: appy-web
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://appy-db:5432/${DB_NAME:-testdb}
      DB_USERNAME: ${DB_USER:-testuser}
      DB_PASSWORD: ${DB_PASSWORD:-test123}
    depends_on:
      - appy-db
    networks:
      - appy-network

  appy-db:
    image: postgres
    container_name: appy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-testuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test123}
      POSTGRES_DB: ${DB_NAME:-testdb}
    networks:
      - appy-network

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - appy-web
    networks:
      - proxy-network
      - appy-network

networks:
  proxy-network:
    driver: bridge
  appy-network:
    driver: bridge
    internal: true